name: Release

# Builds and releases only when a version tag is pushed, e.g.:
#   npm version patch   (bumps package.json, commits, creates tag vX.Y.Z)
#   git push --follow-tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libxtst6 \
            libxss1 \
            libgtk-3-0 \
            libnss3 \
            libnss3-tools \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgbm1 \
            libdrm2 \
            libxcb1 \
            libxkbcommon0 \
            libx11-6 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libxrender1 \
            libpango-1.0-0 \
            libcairo2 \
            libsecret-1-0

      - name: Install dependencies
        run: npm ci # also runs the postinstall script

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm run test:ci
        env:
          CI: true
          ELECTRON_NO_SANDBOX: 1
          ELECTRON_DISABLE_SANDBOX: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # macOS builds both x64 and arm64 in one run (see package.json "mac.target")
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install setuptools

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst6 libxss1 libgtk-3-0 libnss3 libasound2t64 libgbm1

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version with tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Electron app
        run: npm run build && npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forgetools-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: forgetools-*
          merge-multiple: true

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.AppImage" \) -exec mv {} release/ \;
          ls -la release

      - name: Generate release notes
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}${TAG}"

          section() {
            local title="$1" pattern="$2"
            local entries
            entries=$(git log "$RANGE" --no-merges --pretty=format:"- %s (%h)" -E --grep="$pattern" || true)
            if [ -n "$entries" ]; then
              printf '### %s\n%s\n\n' "$title" "$entries"
            fi
          }

          {
            printf '# 🚀 ForgeTools %s\n\n' "$VERSION"
            if [ -n "$PREV_TAG" ]; then
              printf '## 🔄 Changes since %s\n\n' "$PREV_TAG"
            else
              printf '## 🚀 Initial Release\n\n'
            fi
            section "✨ New Features" '^feat'
            section "🐛 Bug Fixes"    '^fix'
            section "⚡️ Performance"  '^perf'
            section "📝 Documentation" '^docs'

            printf '## 📥 Installation\n\n'
            printf -- '- 🪟 Windows: download `ForgeTools-Portable-%s.exe`\n' "$VERSION"
            printf -- '- 🍎 macOS Intel: download and unzip `ForgeTools-%s-mac-x64.zip`\n' "$VERSION"
            printf -- '- 🍎 macOS Apple Silicon: download and unzip `ForgeTools-%s-mac-arm64.zip`\n' "$VERSION"
            printf -- '- 🐧 Linux: download `ForgeTools-%s.AppImage`\n\n' "$VERSION"

            printf '## 🔍 SHA-256 Checksums\n\n```\n'
            (cd release && sha256sum *)
            printf '```\n'
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ForgeTools ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --draft \
            release/*
