name: Release

# Tests on every branch push and PR. Builds and releases only when a version tag is pushed, e.g.:
#   npm version patch   (bumps package.json, commits, creates tag vX.Y.Z)
#   git push --follow-tags
on:
  # Branch pushes and PRs run the test job only; build and release need a v* tag.
  push:
    tags:
      - "v*"
    branches: [tauri, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils xvfb webkit2gtk-driver

      - name: Install dependencies
        run: npm ci # also runs the postinstall script

      - name: Audit
        if: runner.os == 'Linux' # lockfiles are the same on every OS
        shell: bash
        run: |
          npm audit --omit=dev
          cargo install cargo-audit --locked --quiet
          (cd src-tauri && cargo audit)

      - name: Unit tests
        run: npm run test:unit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: E2E tests (Xvfb)
        if: runner.os == 'Linux'
        run: |
          npm run build:e2e
          xvfb-run -a npx wdio run wdio.conf.mjs

      - name: Release build smoke test
        shell: bash
        run: |
          npx tauri build --no-bundle
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:smoke; else npm run test:smoke; fi

      - name: Report sizes (informational)
        if: always()
        continue-on-error: true
        run: node scripts/report-size.cjs

  build:
    needs: [test]
    # Tags build for release; a manual run builds the assets for inspection only (no release job).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, name: win, args: "--bundles nsis" }
          - { os: macos-latest, name: mac-arm64, target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin --bundles app" }
          - { os: macos-latest, name: mac-x64, target: x86_64-apple-darwin, args: "--target x86_64-apple-darwin --bundles app" }
          - { os: ubuntu-22.04, name: linux, args: "--bundles appimage,deb,rpm" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "Building version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Unsigned build. The action only builds here; our own steps name and upload the assets.
      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Collect release asset
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            win)   cp src-tauri/target/release/forgetools.exe "dist/ForgeTools-Portable-$VERSION.exe" ;;
            mac-*) ditto -c -k --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/ForgeTools.app" "dist/ForgeTools-$VERSION-${{ matrix.name }}.zip" ;;
            linux)
              cp src-tauri/target/release/bundle/appimage/*.AppImage "dist/ForgeTools-$VERSION.AppImage"
              cp src-tauri/target/release/bundle/deb/*.deb "dist/ForgeTools-$VERSION-amd64.deb"
              cp src-tauri/target/release/bundle/rpm/*.rpm "dist/ForgeTools-$VERSION-x86_64.rpm" ;;
          esac
          ls -la dist

      - name: Check AppImage bundles the tray library
        if: runner.os == 'Linux'
        run: |
          APP=$(ls dist/*.AppImage)
          chmod +x "$APP"
          (cd /tmp && "$GITHUB_WORKSPACE/$APP" --appimage-extract >/dev/null)
          find /tmp/squashfs-root -name 'libayatana-appindicator3.so*' | grep -q . || { echo "libayatana-appindicator3 missing from AppImage"; exit 1; }
          dpkg-deb -f dist/*.deb Depends | tee /dev/stderr | grep -q appindicator || { echo ".deb does not depend on appindicator"; exit 1; }

      - name: Report sizes (informational)
        if: always()
        continue-on-error: true
        run: node scripts/report-size.cjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: forgetools-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: forgetools-*
          merge-multiple: true

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec mv {} release/ \;
          ls -la release

      - name: Generate release notes
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}${TAG}"

          section() {
            local title="$1" pattern="$2"
            local entries
            entries=$(git log "$RANGE" --no-merges --pretty=format:"- %s (%h)" -E --grep="$pattern" || true)
            if [ -n "$entries" ]; then
              printf '### %s\n%s\n\n' "$title" "$entries"
            fi
          }

          {
            printf '# 🚀 ForgeTools %s\n\n' "$VERSION"
            if [ -n "$PREV_TAG" ]; then
              printf '## 🔄 Changes since %s\n\n' "$PREV_TAG"
            else
              printf '## 🚀 Initial Release\n\n'
            fi
            section "✨ New Features" '^feat'
            section "🐛 Bug Fixes"    '^fix'
            section "⚡️ Performance"  '^perf'
            section "📝 Documentation" '^docs'

            printf '## 📥 Installation\n\n'
            printf -- '- 🪟 Windows: download `ForgeTools-Portable-%s.exe`\n' "$VERSION"
            printf -- '- 🍎 macOS Intel: download and unzip `ForgeTools-%s-mac-x64.zip`\n' "$VERSION"
            printf -- '- 🍎 macOS Apple Silicon: download and unzip `ForgeTools-%s-mac-arm64.zip`\n' "$VERSION"
            printf -- '- 🐧 Linux: download `ForgeTools-%s.AppImage` (any distro), `ForgeTools-%s-amd64.deb` (Debian/Ubuntu) or `ForgeTools-%s-x86_64.rpm` (Fedora/openSUSE)\n\n' "$VERSION" "$VERSION" "$VERSION"

            printf '## 🔍 SHA-256 Checksums\n\n```\n'
            (cd release && sha256sum *)
            printf '```\n'
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ForgeTools ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest \
            release/*

      # Keep only the 10 newest releases. Git tags are kept, so any version can be rebuilt.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 1000 --exclude-drafts --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes
          done
