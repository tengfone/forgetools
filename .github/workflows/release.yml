name: Release

# Builds and releases only when a version tag is pushed, e.g.:
#   npm version patch   (bumps package.json, commits, creates tag vX.Y.Z)
#   git push --follow-tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install dependencies
        run: npm ci # also runs the postinstall script

      - name: Unit tests
        run: npm run test:unit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  build:
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version with tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: forgetools-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: forgetools-*
          merge-multiple: true

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" \) -exec mv {} release/ \;
          ls -la release

      - name: Generate release notes
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}${TAG}"

          section() {
            local title="$1" pattern="$2"
            local entries
            entries=$(git log "$RANGE" --no-merges --pretty=format:"- %s (%h)" -E --grep="$pattern" || true)
            if [ -n "$entries" ]; then
              printf '### %s\n%s\n\n' "$title" "$entries"
            fi
          }

          {
            printf '# 🚀 ForgeTools %s\n\n' "$VERSION"
            if [ -n "$PREV_TAG" ]; then
              printf '## 🔄 Changes since %s\n\n' "$PREV_TAG"
            else
              printf '## 🚀 Initial Release\n\n'
            fi
            section "✨ New Features" '^feat'
            section "🐛 Bug Fixes"    '^fix'
            section "⚡️ Performance"  '^perf'
            section "📝 Documentation" '^docs'

            printf '## 📥 Installation\n\n'
            printf -- '- 🪟 Windows: download `ForgeTools-Portable-%s.exe`\n' "$VERSION"
            printf -- '- 🍎 macOS Intel: download and unzip `ForgeTools-%s-mac-x64.zip`\n' "$VERSION"
            printf -- '- 🍎 macOS Apple Silicon: download and unzip `ForgeTools-%s-mac-arm64.zip`\n' "$VERSION"
            printf -- '- 🐧 Linux: download `ForgeTools-%s.AppImage`\n\n' "$VERSION"

            printf '## 🔍 SHA-256 Checksums\n\n```\n'
            (cd release && sha256sum *)
            printf '```\n'
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ForgeTools ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest \
            release/*

      # Keep only the 10 newest releases. Git tags are kept, so any version can be rebuilt.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 1000 --exclude-drafts --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes
          done
