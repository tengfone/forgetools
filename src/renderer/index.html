<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ForgeTools - Offline Developer Utilities">
    <title>ForgeTools</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/src/main.css">
    <link rel="stylesheet" href="/vs/editor/editor.main.css">
</head>
<body class="m-0 p-0 font-sans bg-bg-app text-text-primary h-screen overflow-hidden text-[13px] antialiased leading-[1.5]">
    <header class="titlebar">
        <button type="button" class="btn-icon btn-ghost btn-sm sidebar-toggle" id="sidebarToggle" aria-label="Show tools list" aria-controls="sidebar" aria-expanded="false"><i class="material-icons" aria-hidden="true">menu</i></button>
        <div class="wordmark text-[12px] pl-1" aria-hidden="true"><span class="wordmark-dot"></span>forge</div>
        <div class="flex-grow"></div>
        <div class="titlebar-controls flex items-center gap-1.5" id="titlebarControls"></div>
    </header>

    <div id="loadingScreen" class="fixed inset-0 bg-bg-app z-[9999] flex flex-col items-center justify-center transition-opacity duration-150 ease-out">
        <div class="wordmark wordmark-lg"><span class="wordmark-dot"></span>forge</div>
        <div class="mt-5 w-[120px] h-px bg-border overflow-hidden">
            <div class="loading-bar w-full h-full bg-accent origin-left"></div>
        </div>
    </div>

    <div class="app-body flex h-[calc(100vh-36px)]" id="appBody">
        <div class="sidebar-scrim" id="sidebarScrim" hidden></div>
        <aside id="sidebar" class="sidebar" aria-label="Tools">
            <div class="mb-1 relative">
                <svg class="search-glyph text-text-secondary" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="sidebar-search" placeholder="Filter tools" aria-label="Search tools" aria-controls="toolsNav" id="sidebarSearch" autocomplete="off" spellcheck="false">
            </div>

            <nav class="flex-1 overflow-y-auto scrollbar-thin" id="toolsNav" aria-label="All tools">
                <!-- Generated by JS -->
            </nav>
            <div id="navEmpty" class="nav-empty" hidden>No tools match</div>
        </aside>

        <main id="mainContent" class="flex-1 flex flex-col overflow-hidden min-w-0">
            <!-- Welcome / Empty State -->
            <div id="welcomeState" class="welcome">
                <div class="welcome-inner">
                    <div class="welcome-head">
                        <h1 class="m-0"><span class="wordmark wordmark-lg"><span class="wordmark-dot" aria-hidden="true"></span>forge</span><span class="sr-only">ForgeTools</span></h1>
                        <p class="welcome-sub">Offline developer utilities. Nothing leaves this machine.</p>
                    </div>
                    <button type="button" class="welcome-search" id="welcomeSearch">
                        <i class="material-icons" aria-hidden="true">search</i>
                        <span>Jump to a tool</span>
                        <span class="ml-auto flex gap-1"><kbd class="mod-key">Ctrl</kbd><kbd>K</kbd></span>
                    </button>
                    <div class="welcome-paste">
                        <label class="welcome-section" for="welcomePaste">Paste anything</label>
                        <textarea id="welcomePaste" class="form-control welcome-paste-input" rows="3" spellcheck="false" placeholder="Paste a token, JSON, timestamp, colour&hellip;" aria-describedby="welcomeDetect"></textarea>
                        <div id="welcomeDetect" class="welcome-detect" aria-live="polite"></div>
                    </div>
                    <section id="recentSection" class="hidden" aria-labelledby="recentHeading">
                        <h2 class="welcome-section" id="recentHeading">Recent</h2>
                        <div id="recentTools" class="welcome-grid"></div>
                    </section>
                    <section aria-labelledby="popularHeading">
                        <h2 class="welcome-section" id="popularHeading">Popular</h2>
                        <div id="popularTools" class="welcome-grid"></div>
                    </section>
                    <p class="welcome-hint"><kbd class="mod-key">Ctrl</kbd><kbd>K</kbd> switch tools &middot; <kbd class="mod-key">Ctrl</kbd><kbd>Shift</kbd><kbd>C</kbd> copy output &middot; <kbd>F1</kbd> tool help</p>
                </div>
            </div>
            <!-- Tool Container -->
            <div id="toolContainer" class="hidden tool-shell">
                <div class="tool-panel">
                <header class="tool-header">
                    <div class="crumb">
                        <span class="crumb-cat" id="currentToolCat"></span>
                        <span class="crumb-sep" aria-hidden="true">/</span>
                        <h2 id="currentToolTitle" class="crumb-title" tabindex="-1">Tool Name</h2>
                        <span class="crumb-desc" id="currentToolDesc">Tool description goes here</span>
                    </div>
                    <div class="tool-header-actions">
                        <div class="tool-actions" id="toolActions"></div>
                        <div class="relative">
                            <button class="btn-icon btn-ghost btn-sm" id="helpBtn" title="Tool help (F1)" aria-label="Tool help" aria-expanded="false" aria-controls="helpPopover"><i class="material-icons" aria-hidden="true">help_outline</i></button>
                            <div id="helpPopover" class="help-popover" role="region" aria-label="Tool help" tabindex="-1" hidden></div>
                        </div>
                    </div>
                </header>

                <div class="flex-1 overflow-hidden flex flex-col min-h-0" id="workspace">
                    <!-- Editor Interface (Split View) -->
                    <div id="editorInterface" class="hidden flex flex-col h-full">
                    <div class="split-view flex flex-1 min-h-0">
                        <div class="flex-1 flex flex-col border-r border-border min-w-0">
                            <div class="pane-head">
                                <div class="flex items-center gap-1.5">
                                    <span class="pane-label">Input</span>
                                    <button class="btn-icon btn-ghost btn-sm" id="pasteBtn" title="Paste from Clipboard" aria-label="Paste from Clipboard"><i class="material-icons icon-sm" aria-hidden="true">content_paste</i> Paste</button>
                                    <button class="btn-icon btn-ghost btn-sm" id="sampleBtn" title="Load Sample Data" aria-label="Load Sample Data"><i class="material-icons icon-sm" aria-hidden="true">science</i> Sample</button>
                                    <button class="btn-icon btn-ghost btn-sm" id="clearBtn" title="Clear Input" aria-label="Clear Input"><i class="material-icons icon-sm" aria-hidden="true">clear</i> Clear</button>
                                </div>
                            </div>
                            <div class="pane-body">
                                <div id="inputEditor" class="absolute inset-0 z-[1]"></div>
                            </div>
                        </div>
                        <div class="flex-1 flex flex-col min-w-0">
                            <div class="pane-head">
                                <span class="pane-label">Output</span>
                                <div class="flex items-center gap-1.5">
                                    <select id="indentSelect" class="toolbar-select h-[26px]" aria-label="Indentation">
                                        <option value="2">2 spaces</option>
                                        <option value="4">4 spaces</option>
                                        <option value="tab">Tab</option>
                                    </select>
                                    <button class="btn-icon btn-sm" id="copyBtn" title="Copy Output (Ctrl+Shift+C)"><i class="material-icons icon-sm" aria-hidden="true">content_copy</i> Copy</button>
                                </div>
                            </div>
                            <div class="pane-body">
                                <div id="outputEditor" class="absolute inset-0 z-[1]"></div>
                            </div>
                        </div>
                    </div>
                    </div>
                    <!-- Custom Interfaces will be injected here -->
                    <div id="customInterface" class="simple-tool-container hidden w-full overflow-y-auto h-full">
                        <!-- Dynamic Content -->
                    </div>
                </div>
                </div>
                <div class="status-bar" id="statusBar"><span class="status-dot" aria-hidden="true"></span><span class="status-msg" id="statusMsg" aria-hidden="true">Ready</span><span class="status-meta" id="statusMeta" aria-hidden="true">offline</span><span class="status-meta font-mono" id="statusSession" title="Inputs are kept in memory while the app is open and cleared on quit">memory only</span><span class="sr-only" id="statusLive" role="status" aria-live="polite"></span></div>
            </div>
        </main>
    </div>

    <!-- Command Palette -->
    <div class="command-palette-overlay fixed inset-0 z-[1000] justify-center items-start pt-[18vh]" id="cmdPalette">
        <div class="command-palette" role="dialog" aria-modal="true" aria-label="Command palette">
            <input type="text" class="cmd-input" placeholder="Search tools" id="cmdInput" role="combobox" aria-expanded="false" aria-controls="cmdResults" aria-autocomplete="list" aria-label="Search tools" autocomplete="off" spellcheck="false">
            <div class="cmd-results scrollbar-thin" id="cmdResults" role="listbox" aria-label="Tools">
                <!-- Results -->
            </div>
            <div class="cmd-footer" aria-hidden="true"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span><span><kbd>&crarr;</kbd> open</span><span><kbd>esc</kbd> close</span></div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-overlay fixed inset-0 z-[1000] hidden justify-end items-start" id="settingsOverlay">
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <div class="h-11 px-4 border-b border-border flex justify-between items-center">
                <h3 class="settings-title" id="settingsTitle">Settings</h3>
                <button class="btn-icon btn-ghost btn-sm" id="settingsClose" aria-label="Close settings"><i class="material-icons icon-sm" aria-hidden="true">close</i></button>
            </div>
            <div class="settings-content p-4 overflow-y-auto">
                <div class="setting-item mb-3">
                    <label class="flex items-center gap-2 text-[13px] cursor-pointer">
                        <input type="checkbox" id="setting-wordwrap" class="cursor-pointer">
                        <span>Word wrap</span>
                    </label>
                </div>
                <div class="setting-item mb-3">
                    <label class="flex items-center gap-2 text-[13px] cursor-pointer" title="Inputs are kept in memory while the app is open and cleared on quit">
                        <input type="checkbox" id="setting-remember" class="cursor-pointer">
                        <span>Remember inputs while switching tools</span>
                    </label>
                </div>
                <div class="setting-item mb-4">
                    <label class="flex items-center gap-2 text-[13px] cursor-pointer">
                        <input type="checkbox" id="setting-minimap" class="cursor-pointer">
                        <span>Show minimap</span>
                    </label>
                </div>
                <div class="setting-item">
                    <label class="ui-label" for="setting-fontsize">Font size</label>
                    <select id="setting-fontsize" class="toolbar-select font-mono">
                        <option value="12">12px</option>
                        <option value="13" selected>13px</option>
                        <option value="14">14px</option>
                        <option value="16">16px</option>
                        <option value="18">18px</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="toolAnnounce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="toastAlert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

    <script src="./vs/loader.js"></script>
    <script type="module" src="/src/app.ts"></script>
</body>
</html>
