<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ForgeTools - Offline Developer Utilities">
    <title>ForgeTools</title>
    <link rel="stylesheet" href="/src/main.css">
    <link rel="stylesheet" href="/vs/editor/editor.main.css">
</head>
<body class="m-0 p-0 font-sans bg-bg-app text-text-primary h-screen overflow-hidden text-[13px] antialiased leading-[1.4]">
    <header class="titlebar h-[52px] flex items-center px-4 bg-transparent border-b border-border dark:bg-transparent relative z-[100]">
        <!-- Custom window controls are hidden - using native controls on all platforms -->
        <div class="titlebar-controls flex gap-2 mr-4" style="display: none;">
            <button class="window-control close" id="closeBtn" aria-label="Close"></button>
            <button class="window-control minimize" id="minimizeBtn" aria-label="Minimize"></button>
            <button class="window-control maximize" id="maximizeBtn" aria-label="Maximize"></button>
        </div>
        <div class="font-semibold text-[13px] text-text-primary flex-grow text-center opacity-90">ForgeTools</div>
        <div class="w-[50px]"></div>
    </header>

    <div id="loadingScreen" class="fixed inset-0 bg-bg-app z-[9999] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="text-[48px] mb-4">🛠️</div>
        <div class="text-sm font-medium text-text-secondary">ForgeTools</div>
        <div class="mt-6 w-[120px] h-0.5 bg-bg-input rounded-sm overflow-hidden">
            <div class="w-full h-full bg-accent animate-[loading_1.5s_infinite_ease-in-out] origin-left"></div>
        </div>
        <style>
            @keyframes loading {
                0% { transform: scaleX(0); }
                50% { transform: scaleX(1); }
                100% { transform: scaleX(0); transform-origin: right center; }
            }
        </style>
    </div>

    <div class="flex h-[calc(100vh-52px)]">
        <aside class="w-[260px] bg-bg-sidebar border-r border-border flex flex-col p-2 backdrop-blur-[20px]">
            <div class="mb-2">
                <input type="text" class="w-full bg-bg-input border border-transparent rounded-[6px] py-1.5 pl-[30px] pr-2.5 text-text-primary text-[13px] outline-none transition-all duration-200 bg-no-repeat focus:bg-bg-app focus:border-accent focus:shadow-[0_0_0_3px_rgba(10,132,255,0.15)]" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;gray&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;8&quot;></circle><line x1=&quot;21&quot; y1=&quot;21&quot; x2=&quot;16.65&quot; y2=&quot;16.65&quot;></line></svg>'); background-position: 8px center;" placeholder="Search tools... (Cmd+K)" id="sidebarSearch">
            </div>
            
            <nav class="flex-1 overflow-y-auto scrollbar-thin" id="toolsNav">
                <!-- Generated by JS -->
            </nav>
        </aside>

        <main class="flex-1 flex flex-col bg-bg-app overflow-hidden">
            <!-- Welcome / Empty State -->
            <div id="welcomeState" class="flex flex-col items-center justify-center h-full text-text-secondary">
                <div class="text-[64px] mb-6 opacity-20">🛠️</div>
                <h2 class="text-2xl font-semibold mb-2">Welcome to ForgeTools</h2>
                <p>Select a tool from the sidebar or press Cmd+K to search.</p>
            </div>

            <!-- Tool Container -->
            <div id="toolContainer" class="hidden h-full flex flex-col">
                <header class="py-3 px-4 border-b border-border flex justify-between items-center bg-bg-app">
                    <div>
                        <h2 id="currentToolTitle" class="m-0 text-xl font-semibold tracking-[-0.5px]">Tool Name</h2>
                        <div class="text-text-secondary text-[13px] mt-1" id="currentToolDesc">Tool description goes here</div>
                    </div>
                    <div class="tool-actions" id="toolActions">
                        <!-- Dynamic Actions -->
                    </div>
                </header>

                <div class="flex-1 overflow-hidden flex flex-col" id="workspace">
                    <!-- Editor Interface (Split View) -->
                    <div id="editorInterface" class="split-view hidden flex h-full">
                        <div class="flex-1 flex flex-col border-r border-border min-w-0">
                            <div class="px-3 h-11 bg-bg-panel border-b border-border flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <span class="text-[13px] font-medium text-text-secondary mr-2">Input:</span>
                                    <button class="btn-pill flex items-center gap-1.5 bg-transparent border border-transparent text-text-secondary px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer transition-all duration-100 h-7 font-sans hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)] hover:text-text-primary dark:hover:text-text-primary active:translate-y-px" id="pasteBtn" title="Paste from Clipboard" aria-label="Paste from Clipboard"><i class="material-icons text-base opacity-80">content_paste</i> Paste</button>
                                    <button class="btn-pill flex items-center gap-1.5 bg-transparent border border-transparent text-text-secondary px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer transition-all duration-100 h-7 font-sans hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)] hover:text-text-primary dark:hover:text-text-primary active:translate-y-px" id="sampleBtn" title="Load Sample Data" aria-label="Load Sample Data"><i class="material-icons text-base opacity-80">data_object</i> Sample</button>
                                    <button class="btn-pill flex items-center gap-1.5 bg-transparent border border-transparent text-text-secondary px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer transition-all duration-100 h-7 font-sans hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)] hover:text-text-primary dark:hover:text-text-primary active:translate-y-px" id="clearBtn" title="Clear Input" aria-label="Clear Input"><i class="material-icons text-base opacity-80">delete_outline</i> Clear</button>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button class="btn-icon flex items-center gap-1.5 bg-transparent border border-transparent text-text-secondary px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer transition-all duration-100 h-7 font-sans hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)] hover:text-text-primary dark:hover:text-text-primary active:translate-y-px" id="settingsBtn" title="Settings"><i class="material-icons text-base opacity-80">settings</i></button>
                                    <select id="languageSelect" class="hidden bg-bg-input text-text-primary border border-transparent px-2 rounded-md text-xs h-7 outline-none cursor-pointer hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)]">
                                        <!-- Populated by JS -->
                                    </select>
                                </div>
                            </div>
                            <div class="flex-1 relative bg-bg-app overflow-hidden">
                                <div id="inputEditor" class="absolute inset-0 z-[1]"></div>
                            </div>
                        </div>
                        <div class="flex-1 flex flex-col border-r-0 min-w-0">
                            <div class="px-3 h-11 bg-bg-panel border-b border-border flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <span class="text-[13px] font-medium text-text-secondary mr-2">Output:</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <select id="indentSelect" class="bg-bg-input text-text-primary border border-transparent px-2 rounded-md text-xs h-7 outline-none cursor-pointer hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)]">
                                        <option value="2">2 spaces</option>
                                        <option value="4">4 spaces</option>
                                        <option value="tab">Tab</option>
                                    </select>
                                    <button class="btn-icon flex items-center gap-1.5 bg-transparent border border-transparent text-text-secondary px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer transition-all duration-100 h-7 font-sans hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)] hover:text-text-primary dark:hover:text-text-primary active:translate-y-px" id="copyBtn" title="Copy Output"><i class="material-icons text-base opacity-80">content_copy</i> Copy</button>
                                </div>
                            </div>
                            <div class="flex-1 relative bg-bg-app overflow-hidden">
                                <div id="outputEditor" class="absolute inset-0 z-[1]"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Custom Interfaces will be injected here -->
                    <div id="customInterface" class="simple-tool-container hidden p-4 max-w-[1000px] mx-auto w-full overflow-y-auto h-full">
                        <!-- Dynamic Content -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Command Palette -->
    <div class="command-palette-overlay fixed inset-0 bg-black/60 backdrop-blur-sm z-[1000] hidden justify-center pt-[15vh]" id="cmdPalette">
        <div class="command-palette w-[600px] max-h-[60vh] bg-bg-card rounded-[14px] shadow-lg border border-border flex flex-col overflow-hidden">
            <input type="text" class="cmd-input w-full p-4 bg-transparent border-none border-b border-border text-text-primary text-lg outline-none" placeholder="Type a command or search..." id="cmdInput">
            <div class="cmd-results overflow-y-auto p-2 scrollbar-thin" id="cmdResults">
                <!-- Results -->
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-overlay fixed inset-0 bg-black/60 backdrop-blur-sm z-[1000] hidden justify-end" id="settingsOverlay">
        <div class="settings-panel w-80 bg-bg-card shadow-lg border-l border-border flex flex-col">
            <div class="settings-header p-4 border-b border-border flex justify-between items-center">
                <h3 class="m-0 text-base font-semibold">Editor Settings</h3>
                <button class="btn-icon flex items-center gap-1.5 bg-transparent border border-transparent text-text-secondary px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer transition-all duration-100 h-7 font-sans hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)] hover:text-text-primary dark:hover:text-text-primary active:translate-y-px" id="settingsClose"><i class="material-icons text-base opacity-80">close</i></button>
            </div>
            <div class="settings-content p-4 overflow-y-auto">
                <div class="setting-item mb-4">
                    <label class="flex items-center gap-2 text-[13px] cursor-pointer">
                        <input type="checkbox" id="setting-wordwrap" class="cursor-pointer">
                        <span>Word Wrap</span>
                    </label>
                </div>
                <div class="setting-item mb-4">
                    <label class="flex items-center gap-2 text-[13px] cursor-pointer">
                        <input type="checkbox" id="setting-minimap" class="cursor-pointer">
                        <span>Show Minimap</span>
                    </label>
                </div>
                <div class="setting-item mb-4">
                    <label class="block mb-1.5 text-[13px]">Font Size</label>
                    <select id="setting-fontsize" class="bg-bg-input text-text-primary border border-transparent px-2 rounded-md text-xs h-7 outline-none cursor-pointer hover:bg-[rgba(255,255,255,0.1)] dark:hover:bg-[rgba(0,0,0,0.05)]">
                        <option value="12">12px</option>
                        <option value="13" selected>13px</option>
                        <option value="14">14px</option>
                        <option value="16">16px</option>
                        <option value="18">18px</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // Set Monaco path - use relative path for file:// protocol, absolute for http://
        const isDev = window.location.protocol === 'http:';
        window.monacoPath = isDev ? '/vs' : './vs';
        
        // Configure Monaco Environment BEFORE loading Monaco
        // Provide a mock Worker that satisfies Monaco's interface but runs in main thread
        // This prevents 'define is not defined' errors and worker postMessage errors
        window.MonacoEnvironment = {
            getWorker: function (_workerId, label) {
                // Create a proper mock Worker that implements the full Worker interface
                // Monaco will use this but all processing happens in main thread
                const mockWorker = {
                    postMessage: function(message) {
                        // Silently accept messages - Monaco will handle fallback internally
                        // No actual worker processing needed
                    },
                    terminate: function() {
                        // No-op for mock worker
                    },
                    addEventListener: function(type, listener, options) {
                        // No-op - mock worker doesn't send messages
                    },
                    removeEventListener: function(type, listener, options) {
                        // No-op
                    },
                    dispatchEvent: function(event) {
                        return true;
                    },
                    onmessage: null,
                    onmessageerror: null,
                    onerror: null
                };
                
                // Return the mock worker wrapped in a promise
                // Monaco expects a Promise<Worker>
                return Promise.resolve(mockWorker);
            }
        };
    </script>
    <script src="./vs/loader.js"></script>
    <script type="module" src="/src/tools.ts"></script>
    <script type="module" src="/src/app.ts"></script>
</body>
</html>
