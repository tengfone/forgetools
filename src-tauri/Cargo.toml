[package]
name = "forgetools"
version = "1.0.1"
description = "Offline Developer Utilities"
authors = ["tengfone"]
license = "MIT"
edition = "2021"

[lib]
name = "forgetools_lib"
crate-type = ["rlib"] # desktop-only; mobile would need staticlib/cdylib

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-os = "2.3.2"
log = "0.4.34"
tauri-plugin-log = "2.10.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z" # measured: 0.68 MB smaller than "s", same startup and memory
panic = "abort"
strip = true

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
